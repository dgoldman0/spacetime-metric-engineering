[project]
name = "adm-harness"
version = "0.5.2"
description = "CLI harness for active-rail ADM ledger runs with whole-service field synthesis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "pyyaml", "tabulate", "pyarrow"]

[project.optional-dependencies]
semiclassical = ["scipy", "sympy", "mpmath"]

[project.scripts]
adm-harness = "adm_harness.cli:main"

[tool.setuptools]
packages = ["adm_harness"]

[tool.setuptools.package-data]
adm_harness = ["c1_angular_absolute_kernel.c"]
